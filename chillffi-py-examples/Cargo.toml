# Это крейт примеров для `chillffi-py`.

[package]
name = "chillffi-py-examples"
version = "0.0.0"
edition = "2024"
publish = false

# ======================================================================================================================

autobins = false
autotests = false
autobenches = false

# ======================================================================================================================
# Второй крейт репозитория: примеры (питон-тесты) и их запуск.
#
# Тесты живут в отдельном таргете `tests/suite.rs` со СВОИМ harness
# (`harness = false`) — это обычная программа со своим `main` и своим кодом
# возврата (упавший питон-тест валит `cargo test`).
#
# Почему не build.rs: `cargo build` и `cargo test` надо вести по-разному
# (сборка — быстро и чисто, тесты — с полным окружением), а разделить их
# внутри build.rs штатно НЕЛЬЗЯ:
#
#   * `#[cfg(test)]` в build.rs не работает — Cargo собирает build-скрипт
#     обычным бинарником и никогда — с `--test`;
#   * `PROFILE` = "debug" и при `cargo build`, и при `cargo test`;
#   * `CARGO_CFG_TEST` не существует.
#
# Каталог `tests/` Cargo компилирует ТОЛЬКО при `cargo test` — это и есть
# разделение `cargo build` / `cargo test`. Никакого build.rs не требуется.
#
# Крейт включён в `default-members` воркспейса, поэтому `cargo test` в корне
# репозитория собирает и запускает этот таргет.

# ======================================================================================================================

[target.'cfg(windows)'.dev-dependencies]

cc = "1.2"
# Locates cl.exe/link.exe on Windows (the suite compiles the C helper libraries
# for the python tests); unused elsewhere.

# ======================================================================================================================

[lints]
workspace = true

# ======================================================================================================================
