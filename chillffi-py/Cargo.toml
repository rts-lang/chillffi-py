# Это основной крейт `chillffi-py`.
#
# В нём не должны находиться примеры кода на Rust и Python.
# Всем этим занимается отдельный крейт, а здесь могут быть
# максимум небольшие тесты Rust.

[package]
name = "chillffi-py"
version = "0.0.0"
edition = "2024"
publish = false

# ======================================================================================================================

autobins = false
autotests = false
autobenches = false

# ======================================================================================================================

[lib]
crate-type = ["cdylib"]
# Юнит-тестов и doctest-ов в крейте нет: питон-тесты живут в крейте
# `chillffi-py-examples` (../chillffi-py-examples) и запускаются оттуда.
test = false
doctest = false

# ======================================================================================================================

[dependencies]
chillffi = { path = "../../chillffi", default-features = false }
pyo3 = { version = "0.30.1", features = ["abi3-py310"] }

# ======================================================================================================================

[lints]
workspace = true

# ======================================================================================================================
